<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>캠핑장 예약 관리 - 땡큐캠핑 PRO</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SheetJS for Excel Upload -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Pretendard', sans-serif; background-color: #f8fafc; }
        .site-card { transition: all 0.2s ease-in-out; border: 2px solid transparent; }
        .site-card:hover { transform: translateY(-3px); box-shadow: 0 10px 20px -5px rgba(0, 0, 0, 0.1); }
        .status-badge { transition: background-color 0.2s; }
        /* 스크롤바 커스텀 (오렌지 테마) */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #fdba74; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #f97316; }
        
        .modal-enter { animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeIn { 
            from { opacity: 0; transform: scale(0.95) translateY(10px); } 
            to { opacity: 1; transform: scale(1) translateY(0); } 
        }
        
        /* 커스텀 라디오/체크박스 색상 */
        .accent-orange { accent-color: #f97316; }
    </style>
</head>
<body class="text-gray-800 h-screen flex flex-col overflow-hidden">

                        <h1 class="text-lg font-bold text-gray-900 tracking-tight">임실 캠핑오개 <span class="text-orange-500 font-extrabold">예약관리</span></h1>

                <!-- 우측 컨트롤 (검색 및 초기화) -->

                        <i class="fa-solid fa-rotate-right"></i>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Layout -->

        <!-- Main Content -->

    <script>
        // --- 1. 구역 및 사이트 기본 설정 ---
        const ZONES = [
            { id: 'ALL', name: '전체보기', count: 0, prefix: '' },
            { id: 'A', name: 'A존', count: 11, prefix: 'A-' },
            { id: 'B', name: 'B존', count: 11, prefix: 'B-' },
            { id: 'STONE', name: '파쇄석존', count: 5, prefix: 'S-' }, 
            { id: 'GRASS', name: '잔디존', count: 33, prefix: 'G-' }   
        ];

        let allSites = [];
        ZONES.forEach(zone => {
            if(zone.id === 'ALL') return;
            for(let i = 1; i <= zone.count; i++) {
                const numStr = i.toString().padStart(2, '0');
                allSites.push({
                    id: `${zone.prefix}${numStr}`,
                    zoneId: zone.id,
                    name: `${zone.prefix}${numStr}`
                });
            }
        });

        // --- 2. 상태 관리 (State) ---
        // 구조 변경: { 'A-01': { current: { name, phone, channel... } | null, history: [ { time, action, msg } ] } }
        let siteData = {};
        let currentZoneFilter = 'ALL';
        let currentSearchTerm = '';
        let currentEditingSiteId = null;
        let dialogCallback = null;

        // --- 3. 초기화 및 로컬스토리지 로드 ---
        function init() {
            // 구버전 데이터(reservations) 마이그레이션 또는 신규 로드
            const savedData = localStorage.getItem('imsil_v2_data');
            
            if(savedData) {
                siteData = JSON.parse(savedData);
            } else {
                // 초기 샘플 데이터 세팅
                allSites.forEach(s => {
                    siteData[s.id] = { current: null, history: [] };
                });
                
                // 일부 사이트 예약 샘플
                setSampleRes('A-02', '김캠핑', '010-1111-2222', '땡큐캠핑', 'completed', 60000, 4, '골든리트리버', 1, '조기 입실 요청');
                setSampleRes('B-05', '이멍멍', '010-3333-4444', '스노우라인', 'pending', 50000, 2, '말티즈', 2, '');
                setSampleRes('S-01', '박파쇄', '010-5555-6666', '현장/기타', 'completed', 55000, 3, '웰시코기', 1, '');
                
                saveState();
            }

            renderTabs();
            updateUI();

            // 검색 이벤트
            document.getElementById('searchInput').addEventListener('input', (e) => {
                currentSearchTerm = e.target.value.toLowerCase();
                updateUI();
            });
        }

        function setSampleRes(id, name, phone, channel, status, price, people, dogBreed, dogCount, memo) {
            const now = new Date().toLocaleString('ko-KR');
            siteData[id].current = { name, phone, channel, status, price, people, dogBreed, dogCount, memo };
            siteData[id].history.push({ time: now, action: '신규예약', msg: `[신규] ${name} (${channel})` });
        }

        function saveState() {
            localStorage.setItem('imsil_v2_data', JSON.stringify(siteData));
        }

        // --- STREAMING_CHUNK:JavaScript - UI 업데이트 및 렌더링 ---
        // --- 4. 통계 렌더링 ---
        function updateStats() {
            const total = allSites.length;
            let booked = 0;
            let pending = 0;

            allSites.forEach(site => {
                const res = siteData[site.id]?.current;
                if(res) {
                    if(res.status === 'completed') booked++;
                    else if(res.status === 'pending') pending++;
                }
            });

            const available = total - (booked + pending);

            document.getElementById('stat-total').innerHTML = `${total}<span class="text-sm font-normal text-gray-500 ml-1">개</span>`;
            document.getElementById('stat-booked').innerHTML = `${booked}<span class="text-sm font-normal text-gray-500 ml-1">개</span>`;
            document.getElementById('stat-pending').innerHTML = `${pending}<span class="text-sm font-normal text-gray-500 ml-1">개</span>`;
            document.getElementById('stat-available').innerHTML = `${available}<span class="text-sm font-normal text-gray-500 ml-1">개</span>`;
        }

        // --- 5. 탭 렌더링 ---
        function renderTabs() {
            const container = document.getElementById('zoneTabs');
            container.innerHTML = '';
            
            ZONES.forEach(zone => {
                const isActive = currentZoneFilter === zone.id;
                const btn = document.createElement('button');
                btn.className = `px-4 py-2 rounded-lg text-sm font-bold transition-all shadow-sm border ${
                    isActive 
                    ? 'bg-orange-600 text-white border-orange-600 shadow-md transform scale-105' 
                    : 'bg-white text-gray-600 border-gray-200 hover:bg-gray-50 hover:text-orange-500'
                }`;
                let countStr = zone.count > 0 ? ` <span class="text-xs opacity-80 font-normal">(${zone.count})</span>` : '';
                btn.innerHTML = `${zone.name}${countStr}`;
                btn.onclick = () => {
                    currentZoneFilter = zone.id;
                    const zoneObj = ZONES.find(z => z.id === currentZoneFilter);
                    document.getElementById('currentZoneTitle').innerText = zoneObj.name;
                    renderTabs();
                    updateUI();
                };
                container.appendChild(btn);
            });
        }

        function updateUI() {
            updateStats();
            let filteredSites = allSites;
            
            if(currentZoneFilter !== 'ALL') {
                filteredSites = filteredSites.filter(site => site.zoneId === currentZoneFilter);
            }
            if(currentSearchTerm) {
                filteredSites = filteredSites.filter(site => {
                    if(site.name.toLowerCase().includes(currentSearchTerm)) return true;
                    const res = siteData[site.id]?.current;
                    if(res && (res.name.toLowerCase().includes(currentSearchTerm) || res.phone.includes(currentSearchTerm))) return true;
                    return false;
                });
            }
            renderGrid(filteredSites);
            renderTable(filteredSites);
        }

        // --- STREAMING_CHUNK:JavaScript - 그리드 및 리스트 생성 ---
        // --- 6. 그리드 생성 ---
        function renderGrid(sites) {
            const container = document.getElementById('siteGrid');
            container.innerHTML = '';

            if(sites.length === 0) {
                container.innerHTML = `<div class="col-span-full text-center py-12 text-gray-400 font-medium">검색 결과가 없습니다.</div>`;
                return;
            }

            sites.forEach(site => {
                const data = siteData[site.id] || { current: null };
                const res = data.current;
                
                const el = document.createElement('div');
                el.className = 'site-card cursor-pointer rounded-xl bg-white p-3 flex flex-col justify-between h-28 relative overflow-hidden group';
                el.onclick = () => openModal(site.id);

                if(!res) {
                    // 빈자리
                    el.classList.add('border-gray-200', 'hover:border-teal-400', 'shadow-sm');

                    const nameColor = isPending ? 'text-gray-700' : 'text-orange-900';
                    
                    // 채널 뱃지
                    let chBadge = '';
                    if(res.channel === '땡큐캠핑') chBadge = '<span class="px-1.5 py-0.5 bg-[#f97316] text-white text-[10px] rounded font-bold">땡큐</span>';
                    else if(res.channel === '스노우라인') chBadge = '<span class="px-1.5 py-0.5 bg-slate-700 text-white text-[10px] rounded font-bold">스노</span>';
                    else chBadge = `<span class="px-1.5 py-0.5 bg-gray-200 text-gray-600 text-[10px] rounded font-bold">${res.channel.substring(0,2)}</span>`;

        // --- STREAMING_CHUNK:JavaScript - 모달 및 저장/취소 로직 ---
        // --- 8. 숫자 조절 유틸 ---
        function adjustCount(id, delta) {
            const input = document.getElementById(id);
            let val = parseInt(input.value) || 1;
            val += delta;
            if(val >= input.min && val <= input.max) input.value = val;
        }

        // --- 9. 모달 로직 ---
        function openModal(siteId) {
            currentEditingSiteId = siteId;
            const siteInfo = allSites.find(s => s.id === siteId);
            const data = siteData[siteId] || { current: null, history: [] };
            const res = data.current;
            
            document.getElementById('modalSiteId').innerText = siteId;
            document.getElementById('modalZoneName').innerText = siteInfo ? ZONES.find(z => z.id === siteInfo.zoneId).name : '';
            document.getElementById('modalTitle').innerText = res ? '예약 상세 및 수정' : '신규 예약 등록';
            
            // 폼 채우기
            document.getElementById('formName').value = res ? res.name : '';
            document.getElementById('formPhone').value = res ? res.phone : '';
            document.getElementById('formPrice').value = res ? res.price : '';
            document.getElementById('formPeople').value = res ? res.people : '2';
            document.getElementById('formDogBreed').value = res ? res.dogBreed : '';
            document.getElementById('formDogCount').value = res ? res.dogCount : '1';
            document.getElementById('formStatus').value = res ? res.status : 'completed';
            document.getElementById('formChannel').value = res ? res.channel : '땡큐캠핑';
            document.getElementById('formMemo').value = res ? res.memo : '';

            // 버튼 상태
            const btnCancel = document.getElementById('btnCancelRes');
            if(res) btnCancel.classList.remove('hidden');
            else btnCancel.classList.add('hidden');

            // 히스토리 렌더링
            const historyContainer = document.getElementById('modalHistoryLogs');
            historyContainer.innerHTML = '';
            if(data.history && data.history.length > 0) {
                // 최신순 정렬
                const sorted = [...data.history].reverse();
                sorted.forEach(log => {
                    const actionColor = log.action.includes('취소') ? 'text-red-500' : (log.action.includes('신규') ? 'text-teal-600' : 'text-orange-500');
                    historyContainer.innerHTML += `
                        <div class="flex justify-between items-start pb-2 border-b border-gray-100 last:border-0 last:pb-0">
                            <div>
                                <span class="font-bold ${actionColor} mr-1">[${log.action}]</span>
                                <span class="text-gray-700 font-medium">${log.msg}</span>
                            </div>
                            <span class="text-[10px] text-gray-400 whitespace-nowrap ml-2">${log.time}</span>
                        </div>
                    `;
                });
            } else {
                historyContainer.innerHTML = `<div class="text-gray-400 text-center py-2">히스토리 기록이 없습니다.</div>`;
            }

            document.getElementById('resModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('resModal').classList.add('hidden');
            currentEditingSiteId = null;
        }

        function saveReservation(e) {
            e.preventDefault();
            if(!currentEditingSiteId) return;

            const newRes = {
                name: document.getElementById('formName').value,
                phone: document.getElementById('formPhone').value,
                price: parseInt(document.getElementById('formPrice').value, 10),
                people: parseInt(document.getElementById('formPeople').value, 10),
                dogBreed: document.getElementById('formDogBreed').value,
                dogCount: parseInt(document.getElementById('formDogCount').value, 10),
                status: document.getElementById('formStatus').value,
                channel: document.getElementById('formChannel').value,
                memo: document.getElementById('formMemo').value,
            };

            const now = new Date().toLocaleString('ko-KR');
            let data = siteData[currentEditingSiteId];
            if(!data) data = { current: null, history: [] };
            
            const isEdit = !!data.current;
            const actionLabel = isEdit ? '정보수정' : '신규예약';
            const logMsg = `${newRes.name}님 (${newRes.channel})`;

            data.current = newRes;
            data.history.push({ time: now, action: actionLabel, msg: logMsg });
            
            siteData[currentEditingSiteId] = data;
            saveState();
            
            updateUI();
            closeModal();
            openConfirmDialog('성공', '저장되었습니다.', false);
        }

        function requestCancelReservation() {
            openConfirmDialog(
                '예약 취소', 
                `[${currentEditingSiteId}] 사이트 예약을 취소하시겠습니까?<br><span class="text-xs text-red-500 mt-1 block">※ 취소 기록은 히스토리에 남습니다.</span>`, 
                true, 
                executeCancel
            );
        }

        function executeCancel() {
            if(!currentEditingSiteId) return;
            const now = new Date().toLocaleString('ko-KR');
            let data = siteData[currentEditingSiteId];
            
            if(data && data.current) {
                const name = data.current.name;
                data.history.push({ time: now, action: '예약취소', msg: `${name}님 예약 취소처리` });
                data.current = null;
                saveState();
                updateUI();
                closeModal();
                openConfirmDialog('성공', '예약이 취소되었습니다.', false);
            }
        }

        // --- STREAMING_CHUNK:JavaScript - 다이얼로그 및 기타 유틸 ---
        // --- 10. 커스텀 다이얼로그 (alert/confirm 대체) ---
        function openConfirmDialog(title, message, isConfirm, callback = null) {
            document.getElementById('dialogTitle').innerText = title;
            document.getElementById('dialogMessage').innerHTML = message;
            
            const btnCancel = document.getElementById('dialogBtnCancel');
            const btnConfirm = document.getElementById('dialogBtnConfirm');
            const icon = document.getElementById('dialogIcon');

            if(isConfirm) {
                btnCancel.classList.remove('hidden');
                icon.className = "w-14 h-14 mx-auto rounded-full bg-red-100 text-red-500 flex items-center justify-center text-2xl mb-4";
                icon.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i>';
                btnConfirm.className = "px-6 py-2 bg-red-600 hover:bg-red-700 text-white text-sm font-bold rounded-lg transition-colors shadow-sm";
            } else {
                btnCancel.classList.add('hidden');
                icon.className = "w-14 h-14 mx-auto rounded-full bg-green-100 text-green-500 flex items-center justify-center text-2xl mb-4";
                icon.innerHTML = '<i class="fa-solid fa-check"></i>';
                btnConfirm.className = "px-6 py-2 bg-orange-600 hover:bg-orange-700 text-white text-sm font-bold rounded-lg transition-colors shadow-sm";
            }

            dialogCallback = callback;
            
            // 기존 이벤트 리스너 제거 방식을 위해 클론 사용 (간단한 구현)
            const newBtn = btnConfirm.cloneNode(true);
            btnConfirm.parentNode.replaceChild(newBtn, btnConfirm);
            
            newBtn.addEventListener('click', () => {
                if(dialogCallback) dialogCallback();
                closeDialog();
            });

            document.getElementById('customDialog').classList.remove('hidden');
        }

        function closeDialog() {
            document.getElementById('customDialog').classList.add('hidden');
            dialogCallback = null;
        }

        function requestResetData() {
            openConfirmDialog(
                '데이터 초기화', 
                '모든 예약 데이터와 히스토리를 초기화하시겠습니까?<br><b class="text-red-500">복구할 수 없습니다.</b>', 
                true, 
                () => {
                    localStorage.removeItem('imsil_v2_data');
                    siteData = {};
                    init();
                }
            );
        }

        // CSV 내보내기 (채널 정보 추가)
        function exportToCSV() {
            let csvContent = "data:text/csv;charset=utf-8,\uFEFF";
            csvContent += "구역,사이트명,판매채널,상태,주문자,연락처,숙박인원,결제금액,견종,마리수,메모\n";

            allSites.forEach(site => {
                const res = siteData[site.id]?.current;
                if(res) {
                    const statusKor = res.status === 'completed' ? '결제완료' : '결제대기';
                    const memo = res.memo ? res.memo.replace(/,/g, ' ') : '';
                    const row = `${site.zoneId},${site.name},${res.channel},${statusKor},${res.name},${res.phone},${res.people},${res.price},${res.dogBreed},${res.dogCount},${memo}`;
                    csvContent += row + "\n";
                }
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            const date = new Date().toISOString().slice(0, 10);
            link.setAttribute("download", `캠핑오개_예약명단_${date}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // --- STREAMING_CHUNK:JavaScript - 엑셀 업로드 및 파싱 (SheetJS) ---
        function handleExcelUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, {type: 'array'});
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    const json = XLSX.utils.sheet_to_json(worksheet);

                    processExcelData(json);
                } catch (err) {
                    console.error(err);
                    openConfirmDialog('업로드 오류', '엑셀 파일을 읽는 중 오류가 발생했습니다.<br>올바른 파일(xlsx, csv)인지 확인해주세요.', false);
                } finally {
                    event.target.value = ''; // Input 초기화
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function processExcelData(data) {
            const now = new Date().toLocaleString('ko-KR');
            let updateCount = 0;
            let cancelCount = 0;

            data.forEach(row => {
                // 다운로드 받은 양식과 동일한 헤더 매칭
                const rawSiteName = row['사이트명'] || row['사이트'] || row['Site'];
                if (!rawSiteName) return;

                const site = allSites.find(s => s.name === rawSiteName || s.id === rawSiteName);
                if (!site) return; // 매칭되지 않는 사이트는 패스
                const siteId = site.id;

                const name = row['주문자'] || row['예약자명'] || row['예약자'] || row['이름'] || '';
                const statusKor = row['상태'] || row['예약상태'] || row['상태구분'] || '';
                
                if (!siteData[siteId]) siteData[siteId] = { current: null, history: [] };
                
                // [1] 취소 처리 로직 (엑셀에 취소 상태로 기재된 경우)
                if (statusKor.includes('취소')) {
                    if (siteData[siteId].current && (siteData[siteId].current.name === name || !name)) {
                         siteData[siteId].history.push({ time: now, action: '엑셀(취소)', msg: `${siteData[siteId].current.name}님 예약 취소 (엑셀동기화)` });
                         siteData[siteId].current = null;
                         cancelCount++;
                    }
                    return; // 취소 처리 후 다음 행으로
                }

                if (!name) return; // 취소도 아니고 이름도 없으면 빈 데이터 행이므로 패스

                // [2] 데이터 정제
                const phone = row['연락처'] || row['전화번호'] || row['핸드폰'] || '';
                const channel = row['판매채널'] || row['채널'] || row['예약처'] || '현장/기타';
                const status = (statusKor.includes('완료') || statusKor === '결제완료') ? 'completed' : 'pending';
                
                // 숫자형 데이터 예외처리 정제
                const price = parseInt(String(row['결제금액'] || row['금액'] || '0').replace(/[^0-9]/g, ''), 10) || 0;
                const people = parseInt(String(row['숙박인원'] || row['인원'] || '2').replace(/[^0-9]/g, ''), 10) || 2;
                const dogCount = parseInt(String(row['마리수'] || row['반려견수'] || '1').replace(/[^0-9]/g, ''), 10) || 1;
                const dogBreed = row['견종'] || row['반려견종'] || '';
                const memo = row['메모'] || row['요청사항'] || '';

                const newRes = { name, phone, channel, status, price, people, dogBreed, dogCount, memo };
                const existing = siteData[siteId].current;
                
                // [3] 신규 덮어쓰기 혹은 정보 갱신 판별
                if (!existing) {
                    siteData[siteId].current = newRes;
                    siteData[siteId].history.push({ time: now, action: '엑셀(신규)', msg: `${name}님 (${channel}) 엑셀 예약생성` });
                    updateCount++;
                } else if (
                    existing.name !== name || 
                    existing.status !== status || 
                    existing.channel !== channel ||
                    existing.price !== price ||
                    existing.memo !== memo
                ) {
                    // 예약자명이 바뀌었으면 이전사람 덮어쓰기 (재예약) 로그 추가
                    if (existing.name !== name) {
                        siteData[siteId].history.push({ time: now, action: '엑셀(덮어쓰기)', msg: `[${existing.name}] → [${name}] 변경` });
                    }
                    siteData[siteId].current = newRes;
                    siteData[siteId].history.push({ time: now, action: '엑셀(수정)', msg: `${name}님 정보 갱신 (엑셀동기화)` });
                    updateCount++;
                }
            });

            // 변경사항이 있을 때만 저장 및 UI 업데이트
            if (updateCount > 0 || cancelCount > 0) {
                saveState();
                updateUI();
                openConfirmDialog(
                    '동기화 완료', 
                    `엑셀 데이터가 성공적으로 반영되었습니다.<br><span class="text-xs text-gray-500 font-semibold mt-1 inline-block">신규/수정 반영: ${updateCount}건 | 취소 반영: ${cancelCount}건</span>`, 
                    false
                );
            } else {
                openConfirmDialog('동기화 알림', '새롭게 변경되거나 갱신할 데이터가 없습니다.', false);
            }
        }

        window.onload = init;
    </script>
</body>
</html>
